name: Starforge

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ShyneChikwapulo/Starforge@main
        with:
          token: ${{ secrets.STARFORGE_TOKEN || github.token }}
          publish-branch: starforge-assets

      - name: Commit the metrics snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starforge/metrics.json
          git diff --cached --quiet || git commit -m "chore: update Starforge metrics"
          git push
