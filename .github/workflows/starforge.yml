name: Starforge

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ShyneChikwapulo/Starforge@feat/github-action
        with:
          token: ${{ secrets.STARFORGE_TOKEN || github.token }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starforge
          git diff --cached --quiet || git commit -m "chore: update Starforge visuals"
          git push
